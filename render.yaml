# Render Blueprint for the MiddleMan backend.
# This documents the exact deployment configuration -- see PROJECT_PLAN.md
# Section 10.2 for why a Web Service (not a Static Site) is used here.
#
# You can either let Render auto-detect these settings when creating the
# Web Service manually in the dashboard, or point Render at this file
# directly ("New > Blueprint") to have it read this config automatically.

services:
  - type: web
    name: middleman-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

  - type: web
    name: middleman-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://middleman-nile.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
